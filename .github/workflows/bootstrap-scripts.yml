name: Standalone bootstrap scripts

on:
  pull_request:
    paths:
      - crates/cognia-bootstrap-agent/standalone/**
      - .github/workflows/bootstrap-scripts.yml
  push:
    branches: [master, dev]
    paths:
      - crates/cognia-bootstrap-agent/standalone/**
      - .github/workflows/bootstrap-scripts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    name: ${{ matrix.runtime }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: bash
          - os: ubuntu-latest
            runtime: powershell
          - os: windows-latest
            runtime: powershell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Exercise standalone runtime against local model server
        run: python crates/cognia-bootstrap-agent/standalone/standalone.test.py --runtime ${{ matrix.runtime }}
      - name: Check Bash syntax and focused runtime contracts
        if: matrix.runtime == 'bash'
        run: |
          bash -n crates/cognia-bootstrap-agent/standalone/cognia-bootstrap.sh
          shellcheck crates/cognia-bootstrap-agent/standalone/cognia-bootstrap.sh
          python crates/cognia-bootstrap-agent/standalone/bash-runtime.test.py
      - name: Check PowerShell-specific runtime contracts
        if: matrix.runtime == 'powershell'
        run: python crates/cognia-bootstrap-agent/standalone/powershell-runtime.test.py
